<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinoyProto 3D - Minimalist Text Carousel Builder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: #1a1d24;
      --accent: #ff5500;
      --text-main: #ffffff;
      --text-sub: #a0a5b5;
      --card-bg: #12141c;
      --input-bg: #242834;
      --border: #2a2e3d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    
    header { padding: 20px 40px; border-bottom: 1px solid var(--border); font-weight: 700; letter-spacing: 1px; color: var(--accent); }
    
    .container { display: flex; gap: 40px; padding: 40px; flex: 1; flex-wrap: wrap; justify-content: center; }

    /* Control Panel */
    .controls { background: var(--panel-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border); width: 400px; display: flex; flex-direction: column; gap: 16px; }
    .controls h2 { font-size: 1.1rem; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }

    label { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; display: block; }
    textarea, input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; outline: none; font-size: 0.95rem; }
    textarea { height: 120px; resize: vertical; }

    .btn-export { background: var(--accent); color: white; border: none; padding: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
    .btn-export:hover { opacity: 0.9; }

    /* Preview Canvas (3:4 aspect ratio) */
    .preview-container { display: flex; flex-direction: column; align-items: center; }
    
    #slide-card {
      width: 420px;
      height: 560px; /* 3:4 Aspect Ratio */
      background: var(--card-bg);
      border-radius: 16px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Minimalist Background Element */
    #slide-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    /* Header / Branding */
    .slide-header { display: flex; justify-content: space-between; align-items: center; }
    .logo-badge { background: rgba(255,85,0,0.15); color: var(--accent); font-weight: 800; font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; letter-spacing: 0.5px; border: 1px solid rgba(255,85,0,0.3); }

    /* Body Text */
    .slide-body { flex: 1; display: flex; align-items: center; padding: 20px 0; }
    .post-text { font-size: 1.35rem; line-height: 1.6; color: #eceeef; font-weight: 500; white-space: pre-wrap; word-wrap: break-word; }

    /* Footer Details */
    .slide-footer { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); }
    .footer-item { display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>

  <header>PINOYPROTO 3D STUDIO</header>

  <div class="container">
    <!-- Input Form -->
    <div class="controls">
      <h2>Minimalist Text Slide</h2>
      
      <div>
        <label>Post Text</label>
        <textarea id="inputText" oninput="updatePreview()" placeholder="Enter your text here..."></textarea>
      </div>

      <div>
        <label>Facebook Page</label>
        <input type="text" id="inputFb" oninput="updatePreview()" value="PinoyProto 3D">
      </div>

      <div>
        <label>Contact Number</label>
        <input type="text" id="inputContact" oninput="updatePreview()" value="+63 9XX XXX XXXX">
      </div>

      <button class="btn-export" onclick="exportSlide()">Export Slide (3:4 PNG)</button>
    </div>

    <!-- Preview -->
    <div class="preview-container">
      <div id="slide-card">
        <div class="slide-header">
          <div class="logo-badge">PINOYPROTO 3D</div>
        </div>

        <div class="slide-body">
          <p class="post-text" id="displayContainer">Your custom announcement or details will appear here as you type...</p>
        </div>

        <div class="slide-footer">
          <div class="footer-item">
            <span>FB:</span> <strong id="displayFb">PinoyProto 3D</strong>
          </div>
          <div class="footer-item">
            <span>Contact:</span> <strong id="displayContact">+63 9XX XXX XXXX</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updatePreview() {
      const text = document.getElementById('inputText').value;
      const fb = document.getElementById('inputFb').value;
      const contact = document.getElementById('inputContact').value;

      document.getElementById('displayContainer').innerText = text || "Your custom announcement or details will appear here as you type...";
      document.getElementById('displayFb').innerText = fb || "PinoyProto 3D";
      document.getElementById('displayContact').innerText = contact || "";
    }

    function exportSlide() {
      const card = document.getElementById('slide-card');
      html2canvas(card, { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'text-slide.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
